<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gridatlas</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <label class="search">
        <span class="sr">Search for a city</span>
        <input id="query" type="search" placeholder="Search" autocomplete="off" />
        <div id="results" hidden></div>
      </label>
      <button id="chosen" type="button" title="Copy id" hidden></button>
    </aside>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
